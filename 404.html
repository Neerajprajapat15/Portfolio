<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F0F1A;
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8rem;
      margin: 0;
      background: linear-gradient(135deg, #6C63FF, #FF6B6B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    p {
      color: #94A3B8;
      font-size: 1.2rem;
      margin-top: 0.5rem;
      margin-bottom: 2rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      text-decoration: none;
      padding: 0.8rem 1.8rem;
      background: #8B83FF;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(139, 131, 255, 0.3);
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139, 131, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! This page doesn't exist.</p>
    <a href="/">← Back to Portfolio</a>
  </div>
</body>
</html>
